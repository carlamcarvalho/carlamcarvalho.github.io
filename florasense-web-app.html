/* ---------------- state ---------------- */
function AG(){ return (S.agent ||= {runs:[], reminders:[], sheets:[], vacation:null, nextId:1}) }
let agRun=null, agCtl=null, agGoal="", agCopied=null;
const isoDay = ts => { const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` };
const dayTs = iso => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||"")); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3],9).getTime() };
const fmtD = ts => new Date(ts).toLocaleDateString(LOCALE(),{weekday:"short",day:"numeric",month:"short"});
const plantById = id => S.plants.find(p=>p.id===Number(id));

/* ---------------- the page's tools (shared by every planner) ---------------- */
function waterSchedule(p, untilTs){
  // simulate drying day by day; a watering brings the soil back to mid-range
  const s=SP[p.sp], rate=dryRate(p), mid=(s.m[0]+s.m[1])/2, out=[];
  let m=p.m, ts=S.now;
  if(m<s.m[0]){ out.push(ts); m=mid+(s.m[1]-mid)*0.4 }
  while(ts<untilTs && out.length<20){ ts+=86400e3; m-=rate; if(m<s.m[0]){ out.push(ts); m=mid+(s.m[1]-mid)*0.4 } }
  return out;
}
const TOOLS = [
  { name:"check_plants",
    description:"Returns every plant with its id, name, room, species, current soil moisture and temperature, ideal ranges, status, drying rate per day, next predicted watering date, normal watering volume in ml, probe battery and owner notes. Call this first.",
    run(){ return S.plants.map(p=>{ const s=SP[p.sp], next=waterSchedule(p,S.now+30*86400e3)[0];
      return {id:p.id, name:p.name, room:p.room, species:s.name, moisture_pct:p.m, soil_temp_c:p.t, ideal_moisture:s.m, ideal_soil_temp:s.t,
        status:status(p).k, drying_pct_per_day:+dryRate(p).toFixed(1), next_watering:next?isoDay(next):null, watering_ml:waterAmount({...p,m:s.m[0]}), battery_pct:p.batt, notes:p.notes||""} }) },
    step:(inp,res)=>t("st_check",{n:res.length}) },
  { name:"forecast_until",
    description:"Forecasts, for every plant, the dates it will need water between today and the given date (inclusive), assuming it is watered each time. Input: until (YYYY-MM-DD). Use it for trips or schedules.",
    inputSchema:{type:"object", properties:{until:{type:"string", description:"Last day to forecast, YYYY-MM-DD"}}, required:["until"]},
    run(inp){ const u=dayTs(inp.until); if(!u) throw new Error("until must be a date like 2026-11-20"); if(u<S.now) throw new Error("until is in the past");
      return S.plants.map(p=>({id:p.id, name:p.name, water_on:waterSchedule(p,u).map(isoDay), ml:waterAmount({...p,m:SP[p.sp].m[0]})})) },
    step:(inp)=>t("st_forecast",{d:fmtD(dayTs(inp.until)||S.now)}) },
  { name:"check_rooms",
    description:"Returns each room of the home map with its plants and a verdict: 'room' when several plants there share a problem (e.g. a cold window), 'plant' when only one plant is off, 'single' when there's only one probe. Use it before suggesting where to move plants.",
    run(){ return roomAnalysis().filter(a=>a.plants.length).map(a=>({room:a.name, verdict:a.verdict.kind, issue:a.verdict.issue||null, plants:a.plants.map(x=>({id:x.p.id, name:x.p.name, issue:x.k, by_window:nearWindow(a.room,x.p.pos)}))})) },
    step:(inp,res)=>t("st_rooms",{n:res.length}) },
  { name:"propose_actions",
    description:"Proposes actions for the owner to approve. Nothing happens until they approve each one. Call it once with every action. Types: reminder {plant_id?, date YYYY-MM-DD, text}; note {plant_id, text}; sitter_sheet {plant_ids[], from, to, sitter?}; vacation_watch {from, to}. Returns how many were queued.",
    inputSchema:{type:"object", properties:{actions:{type:"array", items:{type:"object", properties:{
      type:{type:"string", enum:["reminder","note","sitter_sheet","vacation_watch"]}, plant_id:{type:"integer"}, plant_ids:{type:"array", items:{type:"integer"}},
      date:{type:"string"}, from:{type:"string"}, to:{type:"string"}, text:{type:"string"}, sitter:{type:"string"}}, required:["type"]}}}, required:["actions"]},
    run(inp){ const list=Array.isArray(inp.actions)?inp.actions:[]; let n=0, bad=[];
      list.forEach(a=>{ const v=validAction(a); if(v.ok){ agRun.actions.push({...v.a, id:"a"+(AG().nextId++), state:"pending"}); n++ } else bad.push(v.why) });
      if(!n && bad.length) throw new Error(bad.join("; "));
      return {queued:n, rejected:bad, note:"Waiting for the owner's approval. Do not say these are done."} },
    step:(inp,res)=>t("st_propose",{n:res.queued}) },
];
function validAction(a){
  const type=String(a.type||"");
  if(type==="reminder"){ const ts=dayTs(a.date); if(!ts) return {why:"reminder needs date"}; if(a.plant_id!=null&&!plantById(a.plant_id)) return {why:"unknown plant "+a.plant_id};
    return {ok:true, a:{type, plant_id:a.plant_id!=null?Number(a.plant_id):null, date:isoDay(ts), text:String(a.text||"").slice(0,160)}} }
  if(type==="note"){ if(!plantById(a.plant_id)) return {why:"note needs a valid plant_id"}; return {ok:true, a:{type, plant_id:Number(a.plant_id), text:String(a.text||"").slice(0,240)}} }
  if(type==="sitter_sheet"){ const ids=(a.plant_ids||[]).map(Number).filter(plantById); if(!ids.length) return {why:"sitter_sheet needs plant_ids"};
    return {ok:true, a:{type, plant_ids:ids, from:isoDay(dayTs(a.from)||S.now), to:isoDay(dayTs(a.to)||S.now+7*86400e3), sitter:String(a.sitter||"").slice(0,60)}} }
  if(type==="vacation_watch"){ const f=dayTs(a.from), to=dayTs(a.to); if(!f||!to||to<f) return {why:"vacation_watch needs from <= to"}; return {ok:true, a:{type, from:isoDay(f), to:isoDay(to)}} }
  return {why:"unknown action type "+type};
}
function callTool(name, inp){
  const tool=TOOLS.find(x=>x.name===name), step={tool:name, input:inp||{}};
  agRun.steps.push(step); render();
  try{ const res=tool.run(inp||{}); step.label=tool.step(inp||{},res); render(); return res }
  catch(e){ step.label=t("st_error",{e:e.message}); render(); throw e }
}

/* ---------------- planners ---------------- */
function agentPrompt(){
  return `You are FloraSense Agent, working for the owner of these indoor plants. Today is ${isoDay(S.now)} (${new Date(S.now).toLocaleDateString("en-GB",{weekday:"long"})}).
You reach the owner's goal in steps: read data with tools, then PROPOSE actions. Nothing happens until the owner approves each action.
1. Call check_plants. If the goal involves dates (a trip, a week, a schedule), also call forecast_until with the last relevant day. If it involves temperature, light, where plants stand or a recurring problem, also call check_rooms.
2. Call propose_actions ONCE with every action. Use concrete dates (YYYY-MM-DD) and the plant ids from check_plants.
   - reminder: dated to-do for the owner or the plant-sitter (include ml for waterings).
   - note: care advice stored on a plant.
   - sitter_sheet: only the plants someone must water while the owner is away.
   - vacation_watch: the trip dates, when the owner is away.
   Group reminders by day (one reminder per day listing every plant and its ml); propose at most 10 actions.
3. Reply with a short plan: what you found, what you proposed, and what you will check afterwards.
Rules: FloraSense Gen 1 can't water by itself, so a person waters. Never say an action is done; it waits for approval. Never give pesticide doses, pet-toxicity or human-health advice. Use only the data from the tools.
Reply in ${S.lang==="pt"?"European Portuguese":"English"}, plain text without markdown, at most 110 words.`;
}
const schemaOf = tl => tl.inputSchema || {type:"object", properties:{}};

async function planWithViewer(goal){
  const lim=await viewerSample.limits().catch(()=>null);
  if(!lim||!lim.tools) throw {code:"tools_unavailable"};
  agCtl=new AbortController();
  const {text}=await viewerSample(`${agentPrompt()}\n\nOwner's goal: ${goal}`, {
    signal:agCtl.signal,
    tools:TOOLS.map(tl=>({name:tl.name, description:tl.description, inputSchema:schemaOf(tl), execute:(inp)=>callTool(tl.name,inp)})),
    onText:({text})=>{ agRun.text=text; render() },
  });
  return text.trim();
}

async function planWithKey(goal){
  const client=await getClient();
  const tools=TOOLS.map(tl=>({name:tl.name, description:tl.description, input_schema:schemaOf(tl)}));
  const messages=[{role:"user", content:`Owner's goal: ${goal}`}];
  for(let round=0; round<6; round++){
    const res=await client.beta.messages.create({
      model:MODEL, max_tokens:16000, output_config:{effort:"medium"},
      betas:["server-side-fallback-2026-07-01"], fallbacks:"default",
      system:agentPrompt(), tools, messages,
    });
    if(res.stop_reason==="refusal") return t("ai_refused");
    messages.push({role:"assistant", content:res.content});
    const uses=res.content.filter(b=>b.type==="tool_use");
    const txt=res.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    if(txt){ agRun.text=txt; render() }
    if(res.stop_reason!=="tool_use" || !uses.length) return txt;
    messages.push({role:"user", content:uses.map(u=>{ try{ return {type:"tool_result", tool_use_id:u.id, content:JSON.stringify(callTool(u.name,u.input))} }
      catch(e){ return {type:"tool_result", tool_use_id:u.id, content:"Error: "+e.message, is_error:true} } })});
  }
  return agRun.text;
}

// Local rules: same tools, same approval flow, no AI
const MONTHS={jan:0,janeiro:0,feb:1,fev:1,fevereiro:1,february:1,mar:2,march:2,marco:2,apr:3,abr:3,april:3,abril:3,may:4,mai:4,maio:4,jun:5,june:5,junho:5,jul:6,july:6,julho:6,aug:7,ago:7,august:7,agosto:7,sep:8,sept:8,set:8,september:8,setembro:8,oct:9,out:9,october:9,outubro:9,nov:10,november:10,novembro:10,dec:11,dez:11,december:11,dezembro:11};
function parseTrip(goal){
  const g=goal.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const m=/(\d{1,2})\s*(?:-|–|to|a|ate|until)\s*(\d{1,2})\s*(?:de\s+)?([a-z]+)?/.exec(g);
  const now=new Date(S.now);
  if(m){ let mon=m[3]&&MONTHS[m[3]]!==undefined?MONTHS[m[3]]:(MONTHS[m[3]?.slice(0,3)]??now.getMonth()); let yr=now.getFullYear(); if(mon<now.getMonth()) yr++;
    const a=new Date(yr,mon,+m[1],9).getTime(), b=new Date(yr,mon,+m[2],9).getTime(); if(b>=a&&a>S.now) return [a,b] }
  const start=S.now+(/next week|proxima semana/.test(g)?7:1)*86400e3; return [start, start+7*86400e3];
}
async function planLocally(goal){
  const pause=()=>new Promise(r=>setTimeout(r,350));
  const g=goal.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const plants=callTool("check_plants",{}); await pause();
  const props=[];
  let text;
  if(/vacation|holiday|away|trip|travel|ferias|fora|viagem|viajar/.test(g)){
    const [a,b]=parseTrip(goal);
    const fc=callTool("forecast_until",{until:isoDay(b)}); await pause();
    const during=fc.filter(f=>f.water_on.some(d=>dayTs(d)>=a&&dayTs(d)<=b));
    const before=isoDay(a-86400e3);
    props.push({type:"reminder", date:before, text:t("r_pretrip",{p:S.plants.map(p=>`${p.name} ~${waterAmount({...p,m:SP[p.sp].m[0]})} ml`).join(", "),ml:""}).replace(/ \(~ ml\)/,"")});
    // one sitter visit per day, listing what to water that day
    const byDay={};
    during.forEach(f=>f.water_on.filter(d=>dayTs(d)>=a&&dayTs(d)<=b).forEach(d=>(byDay[d] ||= []).push(`${f.name} ~${f.ml} ml`)));
    Object.keys(byDay).sort().forEach(d=>props.push({type:"reminder", date:d, text:t("r_visit",{list:byDay[d].join(", ")})}));
    if(during.length) props.push({type:"sitter_sheet", plant_ids:during.map(f=>f.id), from:isoDay(a), to:isoDay(b)});
    props.push({type:"vacation_watch", from:isoDay(a), to:isoDay(b)});
    text = during.length ? t("lp_vac",{a:fmtD(a),b:fmtD(b),n:Math.round((b-a)/86400e3)+1,k:during.length,total:plants.length}) : t("lp_vac_none",{a:fmtD(a),b:fmtD(b)});
  } else if(/cold|frost|winter|frio|fria|inverno|geada/.test(g)){
    const rooms=callTool("check_rooms",{}); await pause();
    const coldRooms=rooms.filter(r=>r.verdict==="room"&&r.issue==="cold").map(r=>r.room);
    const cold=S.plants.filter(p=>p.t<SP[p.sp].t[0]+2);
    cold.forEach(p=>{ props.push({type:"reminder", plant_id:p.id, date:isoDay(S.now), text:t("r_cold",{p:p.name})}); props.push({type:"note", plant_id:p.id, text:t("n_cold",{t:SP[p.sp].t[0]})}) });
    props.push({type:"reminder", date:isoDay(S.now+(cold.length?2:3)*86400e3), text:t("r_check")});
    text = cold.length ? t("lp_cold",{k:cold.length}) + (coldRooms.length?" "+t("lp_coldroom",{r:coldRooms.join(", ")}):"") : t("lp_cold_none");
  } else {
    const named=S.plants.find(p=>g.includes(p.name.toLowerCase()) || g.includes(SP[p.sp].common.toLowerCase()) || g.includes(SP[p.sp].name.split(" ")[0].toLowerCase()));
    if(named){
      const s=SP[named.sp], next=waterSchedule(named,S.now+30*86400e3)[0]||S.now, ml=waterAmount(named.m<s.m[0]?named:{...named,m:s.m[0]});
      props.push({type:"reminder", plant_id:named.id, date:isoDay(next), text:t("r_water",{p:named.name,ml})});
      props.push({type:"note", plant_id:named.id, text:t("n_water",{ml})});
      text=t("lp_plant",{p:named.name,m:named.m,a:s.m[0],b:s.m[1],ml,when:isoDay(next)===isoDay(S.now)?(S.lang==="pt"?"para hoje":"for today"):(S.lang==="pt"?"para ":"for ")+fmtD(next)});
    } else if(/week|semana|schedule|plan|regas|watering/.test(g)){
      const fc=callTool("forecast_until",{until:isoDay(S.now+7*86400e3)}); await pause();
      const byDay={};
    fc.forEach(f=>f.water_on.forEach(d=>(byDay[d] ||= []).push(`${f.name} ~${f.ml} ml`)));
    Object.keys(byDay).sort().forEach(d=>props.push({type:"reminder", date:d, text:t("r_waterday",{list:byDay[d].join(", ")})}));
      text=t("lp_week",{k:props.length});
    } else {
      const att=S.plants.filter(needsAttention);
      att.forEach(p=>props.push({type:"reminder", plant_id:p.id, date:isoDay(S.now), text:status(p).k==="dry"?t("r_water",{p:p.name,ml:waterAmount(p)}):status(p).k==="cold"?t("r_cold",{p:p.name}):p.name+": "+stLabel(p)}));
      text=t("lp_fallback",{k:att.length});
    }
  }
  callTool("propose_actions",{actions:props}); await pause();
  return text;
}

async function runAgent(goal){
  goal=String(goal||"").trim(); if(!goal || agRun?.status==="running") return;
  const useClaude=aiOn();
  agRun={id:"r"+(AG().nextId++), goal, at:S.now, status:"running", by:useClaude?"claude":"local", steps:[], text:"", actions:[]};
  AG().runs.unshift(agRun); AG().runs=AG().runs.slice(0,6); render();
  try{
    const text = !useClaude ? await planLocally(goal) : viewerSample ? await planWithViewer(goal) : await planWithKey(goal);
    agRun.text=text||agRun.text; agRun.status="done";
  }catch(e){
    if(e&&e.code==="cancelled"){ agRun.status="stopped" }
    else { agRun.status="error"; agRun.error=t("ag_err",{e:errText(e)}) }
  }
  agCtl=null; save(); render(); announce(agRun.status==="done"?t("ag_pending_n",{n:agRun.actions.filter(a=>a.state==="pending").length}):(agRun.error||""));
}

/* ---------------- applying approved actions ---------------- */
function applyAction(a){
  const st=AG();
  if(a.type==="reminder") st.reminders.push({id:a.id, plant_id:a.plant_id, at:dayTs(a.date), text:a.text, done:false});
  else if(a.type==="note"){ const p=plantById(a.plant_id); if(p) p.notes=(p.notes?p.notes+"\n":"")+a.text }
  else if(a.type==="sitter_sheet") st.sheets.unshift({id:a.id, plant_ids:a.plant_ids, from:a.from, to:a.to, sitter:a.sitter});
  else if(a.type==="vacation_watch") st.vacation={from:a.from, to:a.to};
}
function decide(runId, actId, approve){
  const run=AG().runs.find(r=>r.id===runId); if(!run) return;
  run.actions.filter(a=>a.state==="pending" && (actId==="*"||a.id===actId)).forEach(a=>{ a.state=approve?"approved":"declined"; if(approve) applyAction(a) });
  save(); render();
}
function actionLabel(a){
  const p=a.plant_id!=null?plantById(a.plant_id):null;
  if(a.type==="reminder") return {kind:t("act_reminder"), main:a.text||(p?p.name:""), sub:fmtD(dayTs(a.date))+(p?" · "+p.name:"")};
  if(a.type==="note") return {kind:t("act_note"), main:a.text, sub:p?p.name:""};
  if(a.type==="sitter_sheet") return {kind:t("act_sitter"), main:a.plant_ids.map(id=>plantById(id)?.name).filter(Boolean).join(", "), sub:`${fmtD(dayTs(a.from))} – ${fmtD(dayTs(a.to))}`};
  return {kind:t("act_vacation"), main:`${fmtD(dayTs(a.from))} – ${fmtD(dayTs(a.to))}`, sub:""};
}

/* ---------------- views ---------------- */
function dueReminders(){ return AG().reminders.filter(r=>!r.done && r.at<=S.now+86400e3/2) }
function agentAlertsHTML(row){
  const due=dueReminders(); if(!due.length) return "";
  return `<h2 style="font-size:17px;margin:6px 0 8px">${t("rem_due")}</h2>`+due.map(r=>`<div class="card ag-rem"><div><b>${esc(r.text)}</b><div class="plant-room">${fmtD(r.at)}</div></div><button class="btn-sm" data-ag-done="${r.id}">✓ ${t("ag_done")}</button></div>`).join("");
}
function pAgent(){
  const st=AG(), run=st.runs[0], running=run?.status==="running";
  const steps=run?run.steps.map((s,i)=>`<li><span class="ag-dot" aria-hidden="true">${i+1}</span><div><b>${esc(s.label||s.tool)}</b><code>${esc(s.tool)}(${esc(Object.keys(s.input||{}).length?JSON.stringify(s.input).slice(0,90):"")})</code></div></li>`).join(""):"";
  const pend=run?run.actions.filter(a=>a.state==="pending").length:0;
  const acts=run?run.actions.map(a=>{ const L=actionLabel(a);
    return `<li class="ag-act ${a.state}"><div><span class="ag-kind">${L.kind}</span><b>${esc(L.main)}</b>${L.sub?`<div class="plant-room">${esc(L.sub)}</div>`:""}</div>
     ${a.state==="pending"?`<div class="ag-btns"><button class="btn-sm ag-ok" data-ag-ok="${run.id}:${a.id}">${t("ag_approve")}</button><button class="btn-sm" data-ag-no="${run.id}:${a.id}">${t("ag_decline")}</button></div>`
       :`<span class="pill ${a.state==="approved"?"s-ok":"s-dry"}">${a.state==="approved"?t("ag_approved"):t("ag_declined")}</span>`}</li>` }).join(""):"";
  const rems=st.reminders.filter(r=>!r.done).sort((a,b)=>a.at-b.at).slice(0,8);
  const vac=st.vacation;
  let h=`<div class="head"><div><div class="eyebrow">${t("ag_level")}</div><h1>${t("ag_title")}</h1></div><span class="ai-chip">${aiOn()?t("ag_by_claude"):t("ag_by_local")}</span></div>
  <div class="ag-grid"><div class="ag-main">
   <form class="card ag-goal" id="ag-form"><label for="ag-goal"><b>${t("ag_goal")}</b></label>
    <div class="ag-row"><input class="field" id="ag-goal" value="${esc(agGoal)}" placeholder="${t("ag_goal_ph")}" autocomplete="off" ${running?"disabled":""}>
    ${running&&agCtl?`<button type="button" class="btn ghost" data-ag-stop>${t("ag_stop")}</button>`:`<button class="btn" ${running?"disabled":""}>${running?t("ag_running"):t("ag_run")}</button>`}</div>
    <div class="chips">${["ag_ex1","ag_ex2","ag_ex3","ag_ex4"].map(k=>`<button type="button" data-ag-ex="${esc(t(k))}" ${running?"disabled":""}>${t(k)}</button>`).join("")}</div>
    ${aiOn()?"":`<p class="plant-room" style="margin:4px 0 0">${t("ag_local_hint")}</p>`}</form>`;
  if(run){
    h+=`<div class="card"><div class="plant-room">“${esc(run.goal)}” · ${run.by==="claude"?t("ag_by_claude"):t("ag_by_local")}</div>
     <h2 class="ag-h">${t("ag_steps")}</h2><ol class="ag-steps">${steps||`<li><span class="ag-dot">…</span><div>${t("ag_running")}</div></li>`}${running?`<li class="ag-live"><span class="ag-dot">…</span><div>${t("ag_running")}</div></li>`:""}</ol>
     ${run.text?`<h2 class="ag-h">${t("ag_plan")}</h2><p class="ag-plan">${esc(run.text)}</p>`:""}
     ${run.error?`<p class="warnbox">${esc(run.error)}</p>`:""}</div>`;
    if(!running) h+=`<div class="card"><div class="ag-acthead"><h2 class="ag-h" style="margin:0">${t("ag_actions")}</h2>${pend>1?`<button class="btn-sm ag-ok" data-ag-ok="${run.id}:*">${t("ag_approve_all")}</button>`:""}</div>
      ${run.actions.length?`<ul class="ag-acts">${acts}</ul><p class="plant-room" style="margin:8px 0 0">${pend?t("ag_pending_n",{n:pend}):t("ag_summary",{a:run.actions.filter(a=>a.state==="approved").length,d:run.actions.filter(a=>a.state==="declined").length})+". "+t("ag_after")}</p>`:`<p class="plant-room">${t("ag_none")}</p>`}</div>`;
  }
  h+=`</div><aside class="ag-side">`;
  if(vac) h+=`<div class="card ag-vac"><b>🧳 ${t("ag_vac_on",{a:fmtD(dayTs(vac.from)),b:fmtD(dayTs(vac.to))})}</b><p class="plant-room">${t("ag_vac_d")}</p>${vacStatus()}<button class="btn-sm" data-ag-endvac>${t("ag_end_vac")}</button></div>`;
  h+=`<div class="card"><b>${t("ag_reminders")}</b>${rems.length?`<ul class="ag-rems">${rems.map(r=>`<li><div><span>${esc(r.text)}</span><span class="plant-room">${fmtD(r.at)}</span></div><button class="btn-sm" data-ag-done="${r.id}" aria-label="${t("ag_done")}">✓</button></li>`).join("")}</ul>`:`<p class="plant-room" style="margin:6px 0 0">${t("ag_no_rem")}</p>`}</div>`;
  if(st.sheets.length) h+=`<div class="card"><b>${t("ag_sheets")}</b>${st.sheets.slice(0,3).map(sh=>`<div class="ag-sheet"><div class="plant-room">${fmtD(dayTs(sh.from))} – ${fmtD(dayTs(sh.to))}</div><div class="share-preview">${esc(sheetText(sh.plant_ids, sh.sitter))}</div><button class="btn-sm" data-ag-copy="${sh.id}">${agCopied===sh.id?t("ag_copied"):t("ag_copy")}</button></div>`).join("")}</div>`;
  if(st.runs.length>1) h+=`<div class="card"><b>${t("ag_history")}</b><ul class="ag-hist">${st.runs.slice(1).map(r=>`<li>“${esc(r.goal)}” · ${r.actions.filter(a=>a.state==="approved").length}/${r.actions.length} ${t("ag_approved").toLowerCase()}</li>`).join("")}</ul></div>`;
  return h+`</aside></div>`;
}
// While away: which plants the sitter has to water today, from the live readings
function vacStatus(){
  const v=AG().vacation, a=dayTs(v.from), b=dayTs(v.to);
  if(S.now<a||S.now>b+86400e3) return "";
  const need=S.plants.filter(p=>p.m<SP[p.sp].m[0]+3);
  return `<p class="ag-watch">${need.length?(S.lang==="pt"?"Hoje quem cuida deve regar: ":"Today the sitter should water: ")+need.map(p=>esc(p.name)).join(", "):(S.lang==="pt"?"Hoje está tudo no intervalo.":"Everything is in range today.")}</p>`;
}

/* ---------------- events (own data-ag-* attributes) ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  if(d.agEx){ agGoal=d.agEx; runAgent(agGoal) }
  else if(d.agStop!==undefined){ agCtl?.abort() }
  else if(d.agOk){ const [r,a]=d.agOk.split(":"); decide(r,a,true) }
  else if(d.agNo){ const [r,a]=d.agNo.split(":"); decide(r,a,false) }
  else if(d.agDone){ const r=AG().reminders.find(x=>x.id===d.agDone); if(r){ r.done=true; save(); render() } }
  else if(d.agEndvac!==undefined){ AG().vacation=null; save(); render() }
  else if(d.agCopy){ const sh=AG().sheets.find(x=>x.id===d.agCopy); if(!sh) return; const txt=sheetText(sh.plant_ids, sh.sitter);
    const ok=()=>{ agCopied=sh.id; render(); setTimeout(()=>{ agCopied=null; render() },1500) };
    navigator.clipboard ? navigator.clipboard.writeText(txt).then(ok,()=>{}) : null }
});
document.addEventListener("submit",e=>{ if(e.target.id==="ag-form"){ e.preventDefault(); agGoal=$("#ag-goal").value; runAgent(agGoal) } });
document.addEventListener("input",e=>{ if(e.target.id==="ag-goal") agGoal=e.target.value });

</script>
<script>

/* =========================================================
   State (this browser only)
   ========================================================= */
const KEY="florasense-web-v3";
const HIST_MAX=30*4+40;
let S = load() || fresh();
function fresh(){ return {now:START.getTime(), plants:[...seedPlants().map(p=>({...p, hist:backfill(p,30), notes:""})), ...homeDemoPlants()], premium:true, nextId:8, chats:{}, lang:"en", theme:"auto", ai:{enabled:false, remember:false}} }
function load(){
  try{ const r=localStorage.getItem(KEY); if(!r) return null; const s=JSON.parse(r);
    s.lang ||= "en"; s.theme ||= "auto"; s.ai ||= {enabled:false, remember:false}; s.plants.forEach(p=>p.notes ??= ""); return s;
  }catch(e){ return null }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }

// UI state (not saved)
let page="plants", sel=S.plants[0]?.id, pair=null, modal=null, filter="all", query="", roomF="", sort="urgent", busy=false;

/* =========================================================
   Simulation
   ========================================================= */
function tick(hours=6){
  S.now += hours*3600e3; const hr=new Date(S.now).getHours();
  S.plants.forEach(p=>{ const s=SP[p.sp];
    p.m=Math.max(2,+(p.m - s.dry/4*(p.t<s.t[0]?0.6:1)*(0.75+Math.random()*0.5)).toFixed(1));
    p.t=+((p.room.includes("window")||p.room.includes("janela")?15:21) + Math.sin((hr-9)/24*2*Math.PI)*1.6 + (Math.random()-.5)*.6).toFixed(1);
    if(Math.random()<.25) p.batt=Math.max(0,p.batt-1);
    p.hist.push({ts:S.now,m:p.m,t:p.t}); if(p.hist.length>HIST_MAX) p.hist.shift();
  });
  save(); render();
}
function water(p){
  const s=SP[p.sp], from=p.m, ml=waterAmount(p);
  p.m=+Math.min(s.m[1]-1,(s.m[0]+s.m[1])/2+(s.m[1]-s.m[0])*(0.2+Math.random()*0.15)).toFixed(1);
  p.hist.push({ts:S.now,m:p.m,t:p.t,w:{ml,from}}); if(p.hist.length>HIST_MAX) p.hist.shift();
  save(); render(); announce(`${p.name}: ${from}% → ${p.m}%`);
}

/* =========================================================
   Pieces
   ========================================================= */
function plantCard(p){
  const s=SP[p.sp], st=status(p);
  return `<button class="plant ${p.id===sel?"sel":""}" data-open="${p.id}" aria-pressed="${p.id===sel}" aria-label="${esc(p.name)}, ${esc(p.room)}: ${stLabel(p)}, ${t("moisture")} ${Math.round(p.m)}%, ${t("soil_temp")} ${p.t.toFixed(1)} °C"><div class="plant-top"><div><div class="plant-name">${esc(p.name)}</div><div class="plant-room">${esc(p.room)}</div></div><span class="pill ${st.cls}">${stLabel(p)}</span></div>
  <div class="metrics"><div class="metric"><small>${t("moisture")}</small><strong>${Math.round(p.m)}%</strong>${rangeBar(p.m,s.m,0,100,(st.k==="dry"||st.k==="wet")?st.k:"ok")}</div>
  <div class="metric"><small>${t("soil_temp")}</small><strong>${p.t.toFixed(1)} °C</strong>${rangeBar(p.t,s.t,5,35,(st.k==="cold"||st.k==="warm")?st.k:"ok")}</div></div></button>`;
}
function detail(p){
  if(!p) return `<div class="card empty">${t("select_plant")}</div>`;
  const s=SP[p.sp], st=status(p);
  const mTxt=p.m<s.m[0]?t("st_dry"):p.m>s.m[1]?t("st_wet"):t("inrange"), tTxt=p.t<s.t[0]?t("st_cold"):p.t>s.t[1]?t("st_warm"):t("inrange");
  return `<div class="card" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><div><h2 style="font-size:24px">${esc(p.name)}</h2><div class="eyebrow"><i>${s.name}</i> · ${esc(p.room)}</div></div><span class="pill ${st.cls}">${stLabel(p)}</span></div>
   <div class="metrics" style="margin:14px 0"><div class="kpi" style="background:var(--bg)"><small>${t("soil_moisture")}</small><strong>${Math.round(p.m)}%</strong><small>${mTxt} · ${t("ideal")} ${s.m[0]}–${s.m[1]}%</small></div>
   <div class="kpi" style="background:var(--bg)"><small>${t("soil_temperature")}</small><strong>${p.t.toFixed(1)} °C</strong><small>${tTxt} · ${t("ideal")} ${s.t[0]}–${s.t[1]} °C</small></div></div>
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><b style="font-size:14px">${t("last_days",{n:range})}</b>
   <div class="seg2" role="group">${[7,30].map(d=>`<button data-range="${d}" class="${range===d?"on":""}" aria-pressed="${range===d}">${t("days",{n:d})}</button>`).join("")}</div></div>
   ${chart(p)}</div>
   ${S.premium?`<div class="coachbox"><small>${t("coach_based")}</small><p>${esc(coachAnswer(p,S.lang==="pt"?"como está":"how is it doing",S.lang))}</p><button data-ask="${p.id}">${t("followup")}</button></div>`
     :`<div class="card"><b>${t("coach_premium")}</b><div class="plant-room">${t("turn_on_premium")}</div></div>`}
   ${p.notes?`<div class="card"><b style="font-size:14px">${t("notes")}</b><p class="notes">${esc(p.notes)}</p></div>`:""}
   ${wateringLog(p)}
   <div class="card" style="font-size:13px;color:var(--muted)">${t("probe",{id:p.probe,b:p.batt})}${p.batt<15?` · <b style="color:var(--dry)">${t("replace")}</b>`:""}<br>${t("next_water")}: ${p.m<s.m[0]?`<b>${t("today")}</b>`:t("in_days",{n:Math.max(1,Math.round(daysToDry(p)))})}</div>
   <div class="detail-actions"><button class="btn" data-water="${p.id}">${t("i_watered")}</button><button class="btn ghost" data-edit="${p.id}">✎ ${t("edit")}</button><button class="btn ghost" data-share="${p.id}">↗ ${t("share")}</button><button class="btn ghost" data-remove="${p.id}">${armed==="rm"+p.id?t("tap_confirm"):t("unpair")}</button></div>`;
}

/* =========================================================
   Pages
   ========================================================= */
const URG={dry:0,wet:1,cold:2,warm:3,ok:4};
function pPlants(){
  const ps=S.plants, att=ps.filter(needsAttention), w=att.find(p=>status(p).k==="dry")||att[0];
  const inRange=ps.length?Math.round((ps.length-att.length)/ps.length*100):0;
  let h=`<div class="head"><div><div class="eyebrow">${fmtDay(S.now)}</div><h1>${t("my_plants")}</h1></div><button class="btn" data-pair>${t("pair")}</button></div>
  <div class="stats">
   <button class="kpi stat ${filter==="all"?"on":""}" data-filter="all" aria-pressed="${filter==="all"}"><small>${t("plants")}</small><strong>${ps.length}</strong><span>${t("show_all")}</span></button>
   <button class="kpi stat ${filter==="attention"?"on":""}" data-filter="attention" aria-pressed="${filter==="attention"}"><small>${t("need_att")}</small><strong>${att.length}</strong><span>${t("show_these")}</span></button>
   <button class="kpi stat ${filter==="ok"?"on":""}" data-filter="ok" aria-pressed="${filter==="ok"}"><small>${t("in_range")}</small><strong>${inRange}%</strong><span>${t("show_healthy")}</span></button>
   <button class="kpi stat" data-goto="settings"><small>${t("plan")}</small><strong>${S.premium?t("premium"):t("free")}</strong><span>${t("manage_plan")}</span></button></div>`;
  if(w){ const s=SP[w.sp], k=status(w).k; h+=`<button class="banner" data-open="${w.id}"><b>${t("ban_"+k,{p:esc(w.name)})}</b><span>${k==="dry"||k==="wet"?`${t("moisture")} ${w.m}%, ${t("ideal")} ${s.m[0]}–${s.m[1]}%`:`${t("soil_temp")} ${w.t} °C, ${t("ideal")} ${s.t[0]}–${s.t[1]} °C`}</span></button>` }
  if(!ps.length) return h+`<div class="card empty">${t("no_probes")}</div>`;
  const rooms=[...new Set(ps.map(p=>p.room))].sort();
  h+=`<div class="toolbar" role="search"><label class="sr" for="q">${t("search")}</label><input class="field" id="q" type="search" value="${esc(query)}" placeholder="${t("search")}">
   <label class="sr" for="roomF">${t("room")}</label><select class="field" id="roomF"><option value="">${t("all_rooms")}</option>${rooms.map(r=>`<option ${r===roomF?"selected":""}>${esc(r)}</option>`).join("")}</select>
   <label class="sr" for="sortSel">Sort</label><select class="field" id="sortSel">${["urgent","name","dry","room"].map(k=>`<option value="${k}" ${k===sort?"selected":""}>${t("sort_"+k)}</option>`).join("")}</select></div>`;
  const ql=query.trim().toLowerCase();
  let shown = filter==="attention" ? att : filter==="ok" ? ps.filter(p=>!needsAttention(p)) : ps.slice();
  if(roomF) shown=shown.filter(p=>p.room===roomF);
  if(ql) shown=shown.filter(p=>[p.name,p.room,SP[p.sp].name,SP[p.sp].common].some(v=>v.toLowerCase().includes(ql)));
  const by={urgent:(a,b)=>URG[status(a).k]-URG[status(b).k]||daysToDry(a)-daysToDry(b), name:(a,b)=>a.name.localeCompare(b.name), dry:(a,b)=>a.m-b.m, room:(a,b)=>a.room.localeCompare(b.room)||a.name.localeCompare(b.name)};
  shown.sort(by[sort]);
  if(shown.length && !shown.some(p=>p.id===sel)) sel=shown[0].id;
  const filtered = filter!=="all"||roomF||ql;
  const note = filtered ? `<div class="row-sum"><span>${t("showing",{n:shown.length,total:ps.length})}</span><button class="btn-sm" data-clear>${t("show_all")}</button></div>` : "";
  const empty = filter==="attention"&&!roomF&&!ql ? t("none_att") : filter==="ok"&&!roomF&&!ql ? t("none_ok") : t("no_match");
  const list = shown.length ? `<div class="grid">${shown.map(plantCard).join("")}</div>` : `<div class="card empty">${empty}</div>`;
  return h+note+`<div class="split"><div>${list}</div><div class="panel-r">${detail(ps.find(p=>p.id===sel))}</div></div>`;
}
function pAlerts(){
  const now=S.plants.filter(needsAttention), soon=S.plants.filter(p=>!needsAttention(p)&&daysToDry(p)<=2), low=S.plants.filter(p=>p.batt<15);
  let h=`<div class="head"><div><div class="eyebrow">${fmtDay(S.now)}</div><h1>${t("alerts")}</h1></div></div>`;
  h+=agentAlertsHTML();   // reminders the Plant Agent set up
  if(!now.length&&!soon.length&&!low.length) return h+(dueReminders().length?"":`<div class="card empty">${t("no_alerts")}</div>`);
  const row=(p,txt,pill)=>`<button class="plant" data-open="${p.id}"><div class="plant-top"><div><div class="plant-name">${esc(p.name)} <span class="plant-room">· ${esc(p.room)}</span></div><div class="plant-room">${txt}</div></div>${pill||""}</div></button>`;
  if(now.length) h+=`<h2 style="font-size:17px;margin:6px 0 8px">${t("now_att")}</h2>`+now.map(p=>{const s=SP[p.sp],st=status(p);return row(p,st.k==="dry"||st.k==="wet"?`${t("moisture")} ${p.m}% · ${t("ideal")} ${s.m[0]}–${s.m[1]}%`:`${t("soil_temp")} ${p.t} °C · ${t("ideal")} ${s.t[0]}–${s.t[1]} °C`,`<span class="pill ${st.cls}">${stLabel(p)}</span>`)}).join("");
  if(soon.length&&S.premium) h+=`<h2 style="font-size:17px;margin:18px 0 8px">${t("predicted")} <span class="premium">Premium</span></h2>`+soon.map(p=>row(p,t("will_need",{n:Math.max(6,Math.round(daysToDry(p)*4)*6)}))).join("");
  if(low.length) h+=`<h2 style="font-size:17px;margin:18px 0 8px">${t("battery")}</h2>`+low.map(p=>row(p,t("batt_row",{id:p.probe,b:p.batt}))).join("");
  return h;
}

/* ---------- Home map ---------- */
function pHome(){ return `<div class="head"><div><div class="eyebrow">${fmtDay(S.now)}</div><h1>${t("hm_title")}</h1></div></div>`+homeMapView() }
function hmOpenPlant(id){ sel=id; page="plants"; render(); window.scrollTo(0,0) }

/* ---------- Coach ---------- */
function pCoach(){
  let h=`<div class="head"><div><div class="eyebrow">Premium · <span class="ai-chip">${aiOn()?t("real_ai")+" · "+aiName():t("local_ai")}</span></div><h1>${t("coach")}</h1></div>${S.premium?qualityBadge():""}</div>`;
  if(!S.premium) return h+`<div class="card"><h2 style="font-size:20px">${t("coach_upsell")}</h2><p class="eyebrow">${t("coach_price")}</p><button class="btn" style="width:auto" data-premium>${t("trial")}</button></div>`;
  if(!S.plants.length) return h+`<div class="card empty">${t("pair_first")}</div>`;
  const p=S.plants.find(x=>x.id===sel)||S.plants[0]; sel=p.id; const c=S.chats[p.id]||[];
  const aiMsg=(m,i)=>`<div class="msg ai">${m.img?`<img src="${m.img}" alt="">`:""}${esc(m.text)}${m.sys?"":`<em>${t("ai_label")}${m.via==="ai"?" · "+aiName():""}</em>
    <div class="rate" role="group" aria-label="${t("helpful")}?"><button data-rate="${p.id}:${i}:up" class="${m.rating==="up"?"on":""}" aria-pressed="${m.rating==="up"}" aria-label="${t("helpful")}">👍</button><button data-rate="${p.id}:${i}:down" class="${m.rating==="down"?"on":""}" aria-pressed="${m.rating==="down"}" aria-label="${t("not_helpful")}">👎</button></div>`}</div>`;
  return h+`<div class="coachpage"><div class="plist" role="group">${S.plants.map(x=>`<button class="${x.id===p.id?"on":""}" data-coach="${x.id}" aria-pressed="${x.id===p.id}"><span><b>${esc(x.name)}</b><br><span class="plant-room">${esc(x.room)}</span></span><span class="pill ${status(x).cls}">${stLabel(x)}</span></button>`).join("")}</div>
   <div class="chatwrap"><div class="context">${t("using",{s:SP[p.sp].name,m:p.m,t:p.t})}</div>
   <div class="chat" id="chat" aria-live="polite">${c.length?"":`<div class="msg ai">${t("hi",{p:esc(p.name)})}<em>${t("ai_label")}</em></div>`}
   ${c.map((m,i)=>m.me?`<div class="msg me">${m.img?`<img src="${m.img}" alt="">`:""}${esc(m.text)}</div>`:aiMsg(m,i)).join("")}
   ${busy?`<div class="msg ai typing">${t("thinking")}</div>`:""}</div>
   <div class="chips">${["q1","q2","q3","q4","q5"].map(k=>`<button data-q="${esc(t(k))}" ${busy?"disabled":""}>${t(k)}</button>`).join("")}<button data-photo ${busy?"disabled":""}>${t("photo")}</button></div>
   <form class="ask" id="askf" style="background:transparent"><label class="sr" for="askq">${t("ask_ph")}</label><input name="q" id="askq" placeholder="${t("ask_ph")}" autocomplete="off" ${busy?"disabled":""}><button ${busy?"disabled":""}>${t("ask")}</button></form></div></div>`;
}

/* ---------- Settings ---------- */
function pSettings(){
  const q=quality();
  return `<div class="head"><div><h1>${t("settings")}</h1></div></div>
  <div class="card setcard"><h2>${t("s_general")}</h2>
   <div class="setrow"><div><b>Premium</b><div class="plant-room">${t("s_premium_d")}</div></div><button class="switch ${S.premium?"on":""}" data-premium role="switch" aria-checked="${S.premium}" aria-label="Premium"></button></div>
   <div class="setrow"><div><b>${t("s_lang")}</b></div><div class="seg2" role="group">${[["en","English"],["pt","Português"]].map(([k,l])=>`<button data-lang="${k}" class="${S.lang===k?"on":""}" aria-pressed="${S.lang===k}">${l}</button>`).join("")}</div></div>
   <div class="setrow"><div><b>${t("s_theme")}</b></div><div class="seg2" role="group">${["auto","light","dark"].map(k=>`<button data-theme="${k}" class="${S.theme===k?"on":""}" aria-pressed="${S.theme===k}">${t("th_"+k)}</button>`).join("")}</div></div>
   <div class="setrow"><div><b>${t("s_quality")}</b><div class="plant-room">${q.rate===null?t("q_none",{n:q.answers}):t("q_line",{r:q.rate,up:q.up,n:q.rated,a:q.answers})}</div></div>${q.rate===null?"":`<span class="pill ${q.rate>=80?"s-ok":"s-dry"}">${q.rate>=80?t("on_target"):t("below_target")}</span>`}</div>
   <div class="setrow"><div><b>${t("s_probes")}</b><div class="plant-room">${S.plants.map(p=>p.probe).join(", ")||t("none")}</div></div></div>
   <div class="setrow"><div><b>${t("s_data")}</b><div class="plant-room">${t("s_data_d")}</div></div><button class="btn-sm" data-csv>${t("export")}</button></div>
   <div class="setrow"><div><b>${t("s_reset")}</b><div class="plant-room">${t("s_reset_d")}</div></div><button class="btn-sm" data-reset>${armed==="reset"?t("tap_confirm"):t("reset")}</button></div></div>
  <div class="card setcard"><h2>${t("s_ai")}</h2><p class="plant-room" style="margin:0">${viewerSample?t("s_ai_d_viewer"):t("s_ai_d",{m:MODEL})}</p>
   <div class="warnbox">⚠ ${viewerSample?t("s_ai_warn_viewer"):t("s_ai_warn")}</div>
   <div class="setrow"><div><b>${t("s_ai_on")}</b></div><button class="switch ${S.ai.enabled?"on":""}" data-aitoggle role="switch" aria-checked="${S.ai.enabled}" aria-label="${t("s_ai_on")}"></button></div>
   ${viewerSample?"":`<label class="eyebrow" for="aikey" style="display:block;margin-top:10px">${t("s_key")}</label>
   <input class="field" id="aikey" type="password" autocomplete="off" value="${esc(apiKey)}" placeholder="${t("s_key_ph")}">
   <label class="check"><input type="checkbox" id="airemember" ${S.ai.remember?"checked":""}> ${t("s_remember")}</label>
   <p class="plant-room" style="margin:0 0 10px">${t("s_key_note")}</p>
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn-sm" data-aitest>${t("s_test")}</button><span class="plant-room" id="aitest">${aiTest}</span></div>`}</div>`;
}

/* ---------- Modals ---------- */
function pairModal(){
  const steps=`<div class="steps">${[1,2,3].map(i=>`<i class="${i<=pair.step?"on":""}"></i>`).join("")}</div>`;
  let h=`<div class="modal" data-closebg><div class="card" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div style="display:flex;justify-content:space-between;align-items:center"><b id="mtitle">${t("pair_title",{n:pair.step})}</b><button class="back" style="margin:0" data-close aria-label="${t("close")}">✕</button></div>${steps}`;
  if(pair.step===1) h+=`<h2 style="font-size:24px;margin-bottom:6px">${t("scan_title")}</h2><p class="eyebrow" style="font-size:14px">${t("scan_d")}</p><button class="btn" data-scan>${t("scan")}</button>`;
  else if(pair.step===2){ const q=(pair.q||"").toLowerCase(), list=SPECIES.filter(s=>!q||s.name.toLowerCase().includes(q)||s.common.toLowerCase().includes(q)).slice(0,6);
    h+=`<div class="context" style="margin-bottom:12px">${t("connected",{id:pair.probe})}</div><h2 style="font-size:24px;margin-bottom:6px">${t("which")}</h2>
    <label class="sr" for="spq">${t("search_sp")}</label><input class="field" id="spq" value="${esc(pair.q||"")}" placeholder="${t("search_sp")}">
    <div id="splist">${list.map(s=>`<button class="opt ${pair.sp===s.id?"on":""}" data-sp="${s.id}" aria-pressed="${pair.sp===s.id}"><div><b>${s.name}</b><small>${t("moisture")} ${s.m[0]}–${s.m[1]}% · ${t("soil_temp")} ${s.t[0]}–${s.t[1]} °C</small></div><span class="radio"></span></button>`).join("")||`<p class="eyebrow">${t("no_sp")}</p>`}</div>
    <button class="btn" data-next ${pair.sp?"":"disabled"}>${t("cont")}</button>`; }
  else { const s=SP[pair.sp];
    h+=`<h2 style="font-size:24px;margin-bottom:6px">${t("name_title")}</h2><label class="eyebrow" for="pname">${t("name")}</label><input class="field" id="pname" value="${esc(s.common)}">
    <label class="eyebrow" for="proom">${t("room")}</label><select class="field" id="proom">${t("rooms").map(r=>`<option>${r}</option>`).join("")}</select>
    <button class="btn" data-done>${t("add")}</button>`; }
  return h+`</div></div>`;
}
function editModal(p){
  const rooms=[...new Set([...t("rooms"),...S.plants.map(x=>x.room)])];
  return `<div class="modal" data-closebg><div class="card" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="mtitle" style="font-size:22px">${t("edit_title",{p:esc(p.name)})}</h2><button class="back" style="margin:0" data-close aria-label="${t("close")}">✕</button></div>
   <label class="eyebrow" for="ename">${t("name")}</label><input class="field" id="ename" value="${esc(p.name)}">
   <label class="eyebrow" for="eroom">${t("room")}</label><input class="field" id="eroom" list="roomlist" value="${esc(p.room)}"><datalist id="roomlist">${rooms.map(r=>`<option value="${esc(r)}">`).join("")}</datalist>
   <label class="eyebrow" for="esp">${t("species")}</label><select class="field" id="esp">${SPECIES.map(s=>`<option value="${s.id}" ${s.id===p.sp?"selected":""}>${s.name} (${s.common})</option>`).join("")}</select>
   <label class="eyebrow" for="enotes">${t("notes")}</label><textarea class="field" id="enotes" placeholder="${t("notes_ph")}">${esc(p.notes||"")}</textarea>
   <div class="detail-actions"><button class="btn" data-esave="${p.id}">${t("save")}</button><button class="btn ghost" data-close>${t("cancel")}</button></div></div></div>`;
}
function shareModal(){
  const ids=modal.ids;
  return `<div class="modal" data-closebg><div class="card" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="mtitle" style="font-size:22px">${t("share_title")}</h2><button class="back" style="margin:0" data-close aria-label="${t("close")}">✕</button></div>
   <p class="plant-room">${t("share_d")}</p>
   <label class="eyebrow" for="sitter">${t("sitter")}</label><input class="field" id="sitter" value="${esc(modal.sitter||"")}">
   <fieldset style="border:0;padding:0;margin:0 0 10px"><legend class="eyebrow">${t("which_plants")}</legend>${S.plants.map(p=>`<label class="check"><input type="checkbox" data-shareid="${p.id}" ${ids.includes(p.id)?"checked":""}> ${esc(p.name)} <span class="plant-room">· ${esc(p.room)}</span></label>`).join("")}</fieldset>
   <div class="share-preview" id="sharepre">${esc(sheetText(ids, modal.sitter))}</div>
   <div class="detail-actions" style="margin-top:12px"><button class="btn" data-copy>${modal.copied?t("copied"):t("copy")}</button><button class="btn ghost" data-dl>⬇ ${t("download")}</button></div></div></div>`;
}
/* =========================================================
   Render (keeps keyboard focus across re-renders)
   ========================================================= */
const FOCUS_ATTRS=["id","data-open","data-filter","data-range","data-rate","data-coach","data-goto","data-sp","data-lang","data-theme","data-shareid","data-q","data-water","data-edit","data-share","data-page","data-esave","data-pair","data-ask","data-photo","data-premium","data-aitoggle","data-reset","data-csv","data-remove"];
function focusKey(el){ if(!el||el===document.body) return null; for(const a of FOCUS_ATTRS){ const v=el.getAttribute&&el.getAttribute(a); if(v!==null&&v!==undefined) return {a,v,pos:el.selectionStart} } return null }
function render(){
  applyTheme();
  const fk=focusKey(document.activeElement), hadModal=modalShown;
  $("#skip").textContent=t("skip");
  $("#mainnav").innerHTML=[["plants","M12 22V10|M12 12c0-5 3-8 8-8 0 5-3 8-8 8z|M12 15c0-4-2.5-6.5-7-6.5 0 4 2.5 6.5 7 6.5z"],["alerts","M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9|M10 21h4"],["home","M3 10.5L12 3l9 7.5|M5 9v11h14V9|M10 20v-6h4v6"],["coach","M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"],["agent","M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z|M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"],["settings","M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1|M15 12a3 3 0 11-6 0 3 3 0 016 0z"]]
    .map(([k,d])=>`<button class="nav ${page===k?"on":""}" data-page="${k}" ${page===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${d.split("|").map(x=>`<path d="${x}"/>`).join("")}</svg>${t("nav_"+k)}${k==="alerts"?`<span class="badge" id="badge" hidden></span>`:""}</button>`).join("");
  $("#content").innerHTML = {plants:pPlants,home:pHome,alerts:pAlerts,coach:pCoach,agent:pAgent,settings:pSettings}[page]();
  setTimeout(()=>$("#mainnav .on")?.scrollIntoView({inline:"nearest", block:"nearest"}));   // keeps the current page visible in the phone top bar
  $("#modal").innerHTML = pair ? pairModal() : modal?.type==="edit" ? editModal(S.plants.find(p=>p.id===modal.id)) : modal?.type==="share" ? shareModal() : "";
  document.querySelectorAll(".quick [data-lang]").forEach(b=>{ b.classList.toggle("on",b.dataset.lang===S.lang); b.setAttribute("aria-pressed",b.dataset.lang===S.lang) });
  const n=S.plants.filter(needsAttention).length; $("#badge").hidden=!n; $("#badge").textContent=n;
  $("#sim-label").textContent=t("sim"); $("#b-day").textContent=t("day"); $("#b-live").textContent=live?t("pause"):t("live");
  $("#clock").textContent=new Date(S.now).toLocaleString(LOCALE(),{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const chat=$("#chat"); if(chat) chat.scrollTop=chat.scrollHeight;
  // focus: into a dialog that just opened; back to its opener when it closes; otherwise keep it where it was
  const hasModal=!!(pair||modal); modalShown=hasModal;
  if(hasModal && !hadModal){ opener=fk; const f=$("#modal").querySelector("input,select,textarea,button:not([data-close])"); f&&f.focus(); return }
  const target = !hasModal && hadModal && opener ? opener : fk;
  if(!hasModal && hadModal) opener=null;
  const el = target && document.querySelector(target.a==="id"?"#"+CSS.escape(target.v):`[${target.a}="${CSS.escape(target.v)}"]`);
  if(el){ el.focus({preventScroll:true}); if(target.pos!=null&&el.setSelectionRange) try{el.setSelectionRange(target.pos,target.pos)}catch(e){} }
  else if(hasModal && !$("#modal").contains(document.activeElement)){ const f=$("#modal").querySelector("input,select,textarea,button:not([data-close])"); f&&f.focus() }   // dialog moved to a new step
}
let opener=null, modalShown=false;   // modalShown: whether the last render showed a dialog

/* =========================================================
   Events
   ========================================================= */
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && (pair||modal)){ pair=null; modal=null; render() } });
document.addEventListener("click",e=>{
  const tgt=e.target.closest("button,[data-closebg]"); if(!tgt) return;
  const d=tgt.dataset, P=id=>S.plants.find(p=>p.id===+id);
  if(d.closebg!==undefined && e.target!==tgt) return;
  if(d.page){ page=d.page; render(); $("#content").focus({preventScroll:true}); window.scrollTo(0,0) }
  else if(d.open){ sel=+d.open; page="plants"; render() }
  else if(d.water){ water(P(d.water)) }
  else if(d.remove){ const p=P(d.remove); if(confirmTap("rm"+p.id)){ S.plants=S.plants.filter(x=>x!==p); save(); render() } }
  else if(d.edit){ modal={type:"edit",id:+d.edit}; render() }
  else if(d.esave){ const p=P(d.esave); p.name=$("#ename").value.trim()||p.name; p.room=$("#eroom").value.trim()||p.room; p.sp=$("#esp").value; p.notes=$("#enotes").value.trim(); modal=null; save(); render(); announce(t("save")+" ✓") }
  else if(d.share){ modal={type:"share", ids:S.plants.map(p=>p.id), sitter:""}; render() }
  else if(d.copy!==undefined){ const txt=sheetText(modal.ids, modal.sitter);
    const done=()=>{ modal.copied=true; render(); setTimeout(()=>{ if(modal){ modal.copied=false; render() } },1500) };
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done,()=>{ selectPre(); }); else selectPre(); }
  else if(d.dl!==undefined){ download(sheetHtml(modal.ids, modal.sitter), (S.lang==="pt"?"folha-de-cuidados":"plant-care-sheet")+".html", "text/html") }
  else if(d.ask){ sel=+d.ask; page="coach"; render() }
  else if(d.coach){ sel=+d.coach; render() }
  else if(d.q){ ask(d.q) }
  else if(d.photo!==undefined){ $("#photo").click() }
  else if(d.range){ range=+d.range; render() }
  else if(d.filter){ filter=d.filter; render() }
  else if(d.clear!==undefined){ filter="all"; query=""; roomF=""; render() }
  else if(d.goto){ page=d.goto; render(); window.scrollTo(0,0) }
  else if(d.lang){ S.lang=d.lang; save(); render() }
  else if(d.theme){ S.theme=d.theme; save(); render() }
  else if(d.rate){ const [pid,i,v]=d.rate.split(":"), m=S.chats[pid][+i]; m.rating = m.rating===v ? null : v; save(); render() }
  else if(d.premium!==undefined){ S.premium=!S.premium; save(); render() }
  else if(d.aitoggle!==undefined){ S.ai.enabled=!S.ai.enabled; save(); render() }
  else if(d.aitest!==undefined){ testAI() }
  else if(d.csv!==undefined){ exportCsv() }
  else if(d.reset!==undefined){ if(confirmTap("reset")){ const keep={lang:S.lang,theme:S.theme,ai:S.ai}; S={...fresh(),...keep}; sel=S.plants[0].id; filter="all"; query=""; roomF=""; save(); render() } }
  else if(d.pair!==undefined){ pair={step:1}; render() }
  else if(d.close!==undefined||d.closebg!==undefined){ pair=null; modal=null; render() }
  else if(d.scan!==undefined){ pair={step:2,probe:"FS-"+(2042+S.nextId),q:"",sp:null}; render() }
  else if(d.sp){ pair.sp=d.sp; render() }
  else if(d.next!==undefined){ pair.step=3; render() }
  else if(d.done!==undefined){
    const s=SP[pair.sp], room=$("#proom").value, p={id:S.nextId++,probe:pair.probe,sp:s.id,name:$("#pname").value.trim()||s.common,room,m:+(s.m[0]+(s.m[1]-s.m[0])*.6).toFixed(1),t:/window|janela/.test(room)?15.5:21.2,batt:100,notes:""};
    p.hist=backfill(p,30,S.now); S.plants.push(p); sel=p.id; pair=null; page="plants"; save(); render();
  }
});
function selectPre(){ const el=$("#sharepre"); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r) }
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="spq"){ pair.q=e.target.value; render() }
  else if(id==="q"){ query=e.target.value; render() }
  else if(id==="aikey"){ apiKey=e.target.value.trim(); saveKey(); aiTest="" }
  else if(id==="sitter"){ modal.sitter=e.target.value; $("#sharepre").textContent=sheetText(modal.ids, modal.sitter) }
});
document.addEventListener("change",e=>{
  const id=e.target.id, d=e.target.dataset;
  if(id==="roomF"){ roomF=e.target.value; render() }
  else if(id==="sortSel"){ sort=e.target.value; render() }
  else if(id==="airemember"){ S.ai.remember=e.target.checked; save(); saveKey() }
  else if(d.shareid){ const i=+d.shareid; modal.ids = e.target.checked ? [...modal.ids,i] : modal.ids.filter(x=>x!==i); $("#sharepre").textContent=sheetText(modal.ids, modal.sitter) }
  else if(id==="photo"){ const f=e.target.files[0]; e.target.value=""; if(f) askPhoto(f) }
});
document.addEventListener("submit",e=>{ if(e.target.id==="askf"){ e.preventDefault(); const q=e.target.q.value.trim(); if(q) ask(q) } });
function exportCsv(){
  const rows=[t("exp_headers"),...S.plants.map(p=>[p.name,SP[p.sp].name,p.room,p.probe,p.m,p.t,stLabel(p),p.notes||""])];
  download(rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"), "florasense-export.csv", "text/csv");
}

/* =========================================================
   AI Coach: local rules, or Claude when the user turns it on
   ========================================================= */
async function ask(q){
  const p=S.plants.find(x=>x.id===sel); if(!p||busy) return;
  const chat=(S.chats[p.id] ||= []);
  chat.push({me:true,text:q});
  if(!aiOn()){ chat.push({me:false,text:coachAnswer(p,q,S.lang),via:"local"}); save(); render(); focusAsk(); return }
  busy=true; save(); render();
  try{ chat.push({me:false,text:await claudeAnswer(p,q,null),via:"ai"}) }
  catch(err){ chat.push({me:false,text:t("ai_error",{e:errText(err)})+"\n\n"+coachAnswer(p,q,S.lang),via:"local"}) }
  busy=false; save(); render(); focusAsk();
}
async function askPhoto(file){
  const p=S.plants.find(x=>x.id===sel); if(!p||busy) return;
  const {full, thumb} = await readImage(file);
  const chat=(S.chats[p.id] ||= []);
  chat.push({me:true,text:t("photo_q"),img:thumb});
  if(!aiOn()){ chat.push({me:false,text:t("photo_needs_ai"),sys:true}); save(); render(); return }
  busy=true; save(); render();
  try{ chat.push({me:false,text:await claudeAnswer(p,t("photo_q"),full),via:"ai"}) }
  catch(err){ chat.push({me:false,text:t("ai_error",{e:errText(err)}),sys:true}) }
  busy=false; save(); render();
}
function focusAsk(){ const i=$("#askq"); i&&i.focus() }
/* ---------- simulator buttons ---------- */
let live=null;
$("#b-tick").onclick=()=>tick(6);
$("#b-day").onclick=()=>{ for(let i=0;i<4;i++) tick(6) };
$("#b-live").onclick=()=>{ if(live){clearInterval(live);live=null} else {live=setInterval(()=>tick(6),2500)} render() };
render();
</script>
